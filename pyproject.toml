[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automate-lab"
version = "0.1.0"
description = "Reusable work-automation pieces from 실무 자동화 공방"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rulrulmo" }]
dependencies = []

[project.optional-dependencies]
watch = ["watchdog>=4.0"]
structured = ["openai>=1.40", "pydantic>=2.0"]
pdf = ["pypdf>=4.0"]
receipts = [
  "openai>=1.40",
  "openpyxl>=3.1",
  "pdfplumber>=0.11",
  "Pillow>=10.0",
  "pytesseract>=0.3",
]
all = ["automate-lab[watch,structured,receipts,pdf]"]

[project.scripts]
automate-lab-watch = "automate_lab.watch:main"

[tool.setuptools.packages.find]
where = ["src"]
